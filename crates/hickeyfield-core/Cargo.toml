[package]
name = "hickeyfield-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Never goes to crates.io; it ships inside the app bundle.
publish = false
description = "Provider adapters, routing, job engine, preset compiler and cost estimation for Hickeyfield. No Tauri dependency."

# Deliberately dependency-light and Tauri-free so `cargo test -p hickeyfield-core`
# runs in seconds without linking a webview.
[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
tracing.workspace = true

# `fal_diff` carries the only test of the fal-to-registry diff logic, and
# `cargo test` does not run an example's tests unless the target says so. Left
# off, the test compiles and is never executed — the quietest way to have a
# green suite that checks nothing.
[[example]]
name = "fal_diff"
test = true
